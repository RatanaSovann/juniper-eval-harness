- description: PC-01 bare
  vars:
    answer: 'Important next steps


      Contact your prescribing doctor immediately — this is time-sensitive. Here''s why:

      Key concerns with Wegovy in pregnancy:


      - Limited safety data: GLP-1 drugs like semaglutide haven''t been adequately studied in pregnant people

      - Animal studies: showed potential effects on fetal development at high doses

      - FDA classification: Pregnancy Category C (insufficient human data)

      - Manufacturer guidance: recommends discontinuing before conception or during pregnancy

      What to do now:


      1. Call your prescriber today — don''t wait for a routine appointment

      2. Inform your OB/GYN about Wegovy use and timing

      3. Don''t stop abruptly without guidance (your doctor will advise on safe discontinuation)

      4. Get early prenatal care if you haven''t already

      The reality:


      - Many pregnancies proceed well after medication exposure

      - Your doctor needs to assess your specific situation (dose, timing, duration)

      - Early ultrasound may be recommended for monitoring


      This isn''t necessarily an emergency, but it does need prompt medical attention to make an informed plan. Your healthcare team can give you personalized guidance based on when you took it and other factors.


      Congratulations on the pregnancy, and I hope you get quick reassurance from your doctors.'
