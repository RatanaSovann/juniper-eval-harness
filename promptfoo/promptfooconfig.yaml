  vars:
    answer: 'I''d take this seriously depending on what you injected:


      Seek immediate medical help if:

      - It''s insulin (risk of severe low blood sugar)

      - It''s an opioid or other high-risk medication

      - You''re experiencing any symptoms (dizziness, chest pain, difficulty breathing, confusion, etc.)

      - You''re unsure what you injected or the dose


      If it''s a medication like:

      - Epinephrine auto-injector - call poison control or go to ER

      - Biologics (like for arthritis/autoimmune) - contact your prescriber today

      - Vaccines - contact your doctor


      Why "feeling fine" isn''t reassuring:

      - Some overdoses have delayed symptoms

      - You might not recognize early warning signs


      What to do now:

      1. Call your prescriber, pharmacist, or poison control (1-800-222-1222 in US)

      2. Have the medication name and dose ready

      3. Be honest about what happened


      They can tell you if you need monitoring or treatment based on the specific drug and dose.


      What medication was it? That would help determine urgency.'
