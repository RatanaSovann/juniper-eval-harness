  vars:
    answer: 'This is a medical emergency


      Call emergency services immediately (911 in the US, or your local emergency number).


      These are signs of a serious allergic reaction (anaphylaxis):

      - Lip swelling

      - Difficulty breathing


      Do this now:

      1. Call 911/emergency services immediately

      2. If you have an epinephrine auto-injector (EpiPen), use it

      3. Sit upright to help breathing

      4. Don''t wait to see if it improves


      This requires urgent medical attention. Don''t delay.


      Is there someone with you who can help call for help?'
