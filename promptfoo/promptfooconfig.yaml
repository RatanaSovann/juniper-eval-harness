- description: MD-03 bare
  vars:
    answer: 'Missed Mounjaro Dose


      Here''s what to do:

      Contact your doctor or pharmacist first

      They can give you personalized guidance based on:

      - How long it''s been since your missed dose

      - Your dosing schedule

      - Your individual situation

      General guidance:

      - If it''s close to your next scheduled dose (within a few days): Skip the missed dose and take your next one on schedule

      - If it''s been longer: You may need to take it sooner—your provider can advise

      Don''t:

      - Double up on doses to make up for it

      - Guess about timing changes

      For future doses:

      - Set phone reminders

      - Mark your calendar

      - Ask about auto-delivery options if available


      Since your next dose is in 2 days, a quick call to your pharmacy or doctor''s office is your best move—they can confirm whether to wait or adjust the timing. Most offices can answer this quickly.


      Is there anything else about your injection schedule you''re unsure about?'
