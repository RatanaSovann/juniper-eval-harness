- description: PC-05 bare
  vars:
    answer: 'Breastfeeding and Wegovy


      The short answer: No, it''s not recommended.


      Here''s why:


      - Limited safety data: Semaglutide (Wegovy''s active ingredient) hasn''t been adequately studied in breastfeeding people

      - Unknown transfer: It''s unclear how much passes into breast milk or what effects it might have on an infant

      - Manufacturer guidance: The prescribing information advises against use while breastfeeding

      What to do


      1. Talk to your prescriber before stopping or continuing—don''t make this decision alone

      2. Discuss alternatives for weight management that are safer during breastfeeding (diet, exercise, timing)

      3. Consider timing if you want to continue—some people explore whether stopping breastfeeding is right for their situation, but that''s a personal decision

      Important context


      - Weight loss goals can often wait until breastfeeding ends

      - Breastfeeding itself burns calories

      - Your doctor can help weigh the risks and benefits for your specific situation


      This is worth a conversation with your OB/GYN or the prescriber who gave you Wegovy—they know your full medical picture.'
