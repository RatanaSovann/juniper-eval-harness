    answer: 'Mounjaro Dosing


      The highest approved dose of Mounjaro (tirzepatide) is 15 mg once weekly.

      Dosing progression:

      - Starting dose: 2.5 mg weekly

      - Doses increase in 2.5 mg increments

      - Maximum: 15 mg weekly

      Important notes:

      - Dose adjustments typically occur every 4 weeks

      - The 15 mg dose is used for both diabetes and weight management (GLP-1 receptor agonist indication)

      - Individual tolerance and response determine the appropriate dose for each patient


      If you have questions about dosing for a specific situation, it''s best to discuss with your healthcare provider, as the right dose depends on individual factors like kidney function, tolerability, and treatment goals.'
