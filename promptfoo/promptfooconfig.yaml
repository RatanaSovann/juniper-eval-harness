- description: PC-02 bare
  vars:
    answer: 'Stopping Wegovy Before Pregnancy


      Here are the key considerations:

      Timing

      - Stop at least 2 months before trying to conceive — this is the standard recommendation, though some sources suggest 3 months to be cautious

      - Semaglutide (Wegovy''s active ingredient) can stay in your system for a while, and there''s limited safety data in pregnancy

      Why the wait

      - Insufficient human pregnancy data exists for semaglutide

      - Animal studies showed some developmental concerns at high doses

      - The washout period reduces any potential risk

      Before stopping, discuss with your doctor:

      - Your specific health situation (PCOS, diabetes, weight management needs)

      - Whether alternative approaches make sense during the conception window

      - Realistic expectations about weight changes after stopping

      - Whether you might restart postpartum (if not breastfeeding)

      Important notes

      - Don''t stop abruptly without guidance — your doctor may recommend tapering

      - Weight regain is common after stopping, which is worth planning for

      - If you become pregnant unexpectedly while on it, inform your OB/GYN immediately (not an emergency, but important for monitoring)


      Bottom line: Have this conversation with both your prescribing doctor and OB/GYN to create a plan that works for your specific circumstances.'
