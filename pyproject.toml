[project]
name = "juniper-eval-harness"
version = "0.1.0"
description = "Independent eval harness for AI answers to Australian GLP-1 patient questions"
requires-python = ">=3.11"
dependencies = ["pydantic>=2", "pyyaml>=6", "anthropic>=1.8", "python-dotenv>=1"]

[project.optional-dependencies]
dev = ["pytest>=8"]
label = ["streamlit>=1.40"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
