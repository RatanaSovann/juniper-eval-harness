[project]
name = "glp1-eval-harness"
version = "0.1.0"
description = "Independent eval harness for AI answers to Australian GLP-1 patient questions"
requires-python = ">=3.11"
dependencies = ["pydantic>=2", "pyyaml>=6", "anthropic>=1.8", "python-dotenv>=1", "openai>=2", "google-genai>=1"]

[project.optional-dependencies]
dev = ["pytest>=8"]
label = ["streamlit>=1.40"]
warehouse = ["google-cloud-bigquery>=3", "dbt-bigquery>=1.12", "dagster>=1.13", "dagster-webserver>=1.13"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools]
packages = ["harness"]   # the only Python package; data/, runs/ etc. are not code
