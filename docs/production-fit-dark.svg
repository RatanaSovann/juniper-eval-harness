<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 700" width="680" height="700" role="img" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title>Where the harness fits in production</title><desc>Patients chat with an AI assistant and chats are logged to a data warehouse. The harness takes a daily sample, runs rules and two judges, and a router sends cases to a scorecard with alerts and to clinician review. Labelled cases feed a kappa check back to the judges, and a regression set that gates model updates before they reach patients.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#B4B2A9" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="60" y="30" width="590" height="170" rx="6" fill="none" stroke="#B4B2A9" stroke-width="0.75" stroke-dasharray="4 4"/><text x="72" y="48" font-size="12" fill="#B4B2A9">A typical live clinic setup</text><rect x="100" y="60" width="300" height="52" rx="4" fill="#444441" stroke="#B4B2A9" stroke-width="0.75"/><text x="250.0" y="82.0" text-anchor="middle" font-size="14" font-weight="600" fill="#F1EFE8">Patients chat with an AI assistant</text><text x="250.0" y="100.0" text-anchor="middle" font-size="12" fill="#D3D1C7">Any vendor's bot</text><path d="M250 112 V134" fill="none" stroke="#B4B2A9" stroke-width="1.5" marker-end="url(#a)"/><rect x="100" y="136" width="300" height="52" rx="4" fill="#444441" stroke="#B4B2A9" stroke-width="0.75"/><text x="250.0" y="158.0" text-anchor="middle" font-size="14" font-weight="600" fill="#F1EFE8">Chat logs</text><text x="250.0" y="176.0" text-anchor="middle" font-size="12" fill="#D3D1C7">Data warehouse, e.g. BigQuery</text><path d="M250 188 V240" fill="none" stroke="#B4B2A9" stroke-width="1.5" marker-end="url(#a)"/><rect x="60" y="212" width="590" height="246" rx="6" fill="none" stroke="#B4B2A9" stroke-width="0.75" stroke-dasharray="4 4"/><text x="72" y="230" font-size="12" fill="#B4B2A9">The harness plugs in here</text><rect x="100" y="242" width="300" height="52" rx="4" fill="#3C3489" stroke="#AFA9EC" stroke-width="0.75"/><text x="250.0" y="264.0" text-anchor="middle" font-size="14" font-weight="600" fill="#EEEDFE">Daily sample</text><text x="250.0" y="282.0" text-anchor="middle" font-size="12" fill="#CECBF6">Risky, unsure, plus random</text><path d="M250 294 V316" fill="none" stroke="#B4B2A9" stroke-width="1.5" marker-end="url(#a)"/><rect x="100" y="318" width="300" height="52" rx="4" fill="#3C3489" stroke="#AFA9EC" stroke-width="0.75"/><text x="250.0" y="340.0" text-anchor="middle" font-size="14" font-weight="600" fill="#EEEDFE">Rules + two judges</text><text x="250.0" y="358.0" text-anchor="middle" font-size="12" fill="#CECBF6">L1 and L2</text><path d="M250 370 V392" fill="none" stroke="#B4B2A9" stroke-width="1.5" marker-end="url(#a)"/><rect x="100" y="394" width="300" height="52" rx="4" fill="#3C3489" stroke="#AFA9EC" stroke-width="0.75"/><text x="250.0" y="416.0" text-anchor="middle" font-size="14" font-weight="600" fill="#EEEDFE">Router</text><text x="250.0" y="434.0" text-anchor="middle" font-size="12" fill="#CECBF6">Versioned routing policy</text><path d="M400 420 H448" fill="none" stroke="#B4B2A9" stroke-width="1.5" marker-end="url(#a)"/><rect x="450" y="394" width="180" height="52" rx="4" fill="#3C3489" stroke="#AFA9EC" stroke-width="0.75"/><text x="540.0" y="416.0" text-anchor="middle" font-size="14" font-weight="600" fill="#EEEDFE">Scorecard + alerts</text><text x="540.0" y="434.0" text-anchor="middle" font-size="12" fill="#CECBF6">dbt, Dagster</text><path d="M250 446 V498" fill="none" stroke="#B4B2A9" stroke-width="1.5" marker-end="url(#a)"/><rect x="60" y="470" width="590" height="170" rx="6" fill="none" stroke="#B4B2A9" stroke-width="0.75" stroke-dasharray="4 4"/><text x="72" y="488" font-size="12" fill="#B4B2A9">People and feedback</text><rect x="100" y="500" width="300" height="52" rx="4" fill="#712B13" stroke="#F0997B" stroke-width="0.75"/><text x="250.0" y="522.0" text-anchor="middle" font-size="14" font-weight="600" fill="#FAECE7">Clinician review</text><text x="250.0" y="540.0" text-anchor="middle" font-size="12" fill="#F5C4B3">Ranked by severity</text><path d="M250 552 V574" fill="none" stroke="#B4B2A9" stroke-width="1.5" marker-end="url(#a)"/><rect x="100" y="576" width="300" height="52" rx="4" fill="#712B13" stroke="#F0997B" stroke-width="0.75"/><text x="250.0" y="598.0" text-anchor="middle" font-size="14" font-weight="600" fill="#FAECE7">Labelled cases</text><text x="250.0" y="616.0" text-anchor="middle" font-size="12" fill="#F5C4B3">Verdict plus reason</text><path d="M400 602 H448" fill="none" stroke="#B4B2A9" stroke-width="1.5" marker-end="url(#a)"/><rect x="450" y="576" width="180" height="52" rx="4" fill="#444441" stroke="#B4B2A9" stroke-width="0.75"/><text x="540.0" y="598.0" text-anchor="middle" font-size="14" font-weight="600" fill="#F1EFE8">Regression set</text><text x="540.0" y="616.0" text-anchor="middle" font-size="12" fill="#D3D1C7">Failures become tests</text><path d="M540 576 V554" fill="none" stroke="#B4B2A9" stroke-width="1.5" marker-end="url(#a)"/><rect x="450" y="500" width="180" height="52" rx="4" fill="#3C3489" stroke="#AFA9EC" stroke-width="0.75"/><text x="540.0" y="522.0" text-anchor="middle" font-size="14" font-weight="600" fill="#EEEDFE">Release gate</text><text x="540.0" y="540.0" text-anchor="middle" font-size="12" fill="#CECBF6">Before model updates</text><path d="M630 526 H662 V86 H402" fill="none" stroke="#B4B2A9" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/><path d="M100 602 H80 V344 H98" fill="none" stroke="#B4B2A9" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/><rect x="60" y="664" width="14" height="14" rx="3" fill="#3C3489" stroke="#AFA9EC" stroke-width="0.75"/><text x="82" y="676" text-anchor="start" font-size="12" fill="#B4B2A9">The harness</text><rect x="180" y="664" width="14" height="14" rx="3" fill="#712B13" stroke="#F0997B" stroke-width="0.75"/><text x="202" y="676" text-anchor="start" font-size="12" fill="#B4B2A9">People</text><rect x="270" y="664" width="14" height="14" rx="3" fill="#444441" stroke="#B4B2A9" stroke-width="0.75"/><text x="292" y="676" text-anchor="start" font-size="12" fill="#B4B2A9">Live systems / data</text><line x1="440" y1="671" x2="472" y2="671" stroke="#B4B2A9" stroke-width="1.5" stroke-dasharray="5 4"/><text x="482" y="676" text-anchor="start" font-size="12" fill="#B4B2A9">Feedback loop</text></svg>
