<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 820" width="680" height="820" role="img" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title>How the harness works</title><desc>73 test cases go to the bot, then rule checks and two AI judges. Blind labels and a judge audit measure the judges and backtest the router. The router sends each answer to auto-pass, human review or auto-fail. The scorecard shows the severe miss rate beside review load; an alert fails the build if a hard fail is auto-passed.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="150" y="40" width="260" height="56" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.75"/><text x="280.0" y="64.0" text-anchor="middle" font-size="14" font-weight="600" fill="#2C2C2A">Test set</text><text x="280.0" y="82.0" text-anchor="middle" font-size="12" fill="#5F5E5A">73 cases: 50 dev, 23 locked</text><path d="M280 96 V118" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#a)"/><rect x="150" y="120" width="260" height="56" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/><text x="280.0" y="144.0" text-anchor="middle" font-size="14" font-weight="600" fill="#3C3489">L0 Bot answers</text><text x="280.0" y="162.0" text-anchor="middle" font-size="12" fill="#534AB7">Claude Haiku 4.5, v1 vs v2</text><path d="M280 176 V198" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#a)"/><rect x="150" y="200" width="260" height="56" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/><text x="280.0" y="224.0" text-anchor="middle" font-size="14" font-weight="600" fill="#3C3489">L1 Rule checks</text><text x="280.0" y="242.0" text-anchor="middle" font-size="12" fill="#534AB7">promptfoo, exact facts</text><path d="M280 256 V278" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#a)"/><rect x="150" y="280" width="260" height="56" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/><text x="280.0" y="304.0" text-anchor="middle" font-size="14" font-weight="600" fill="#3C3489">L2 Two judges</text><text x="280.0" y="322.0" text-anchor="middle" font-size="12" fill="#534AB7">gpt-6-luna + Grok, twice</text><path d="M280 336 V358" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#a)"/><rect x="150" y="360" width="260" height="56" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/><text x="280.0" y="384.0" text-anchor="middle" font-size="14" font-weight="600" fill="#3C3489">L4 Router</text><text x="280.0" y="402.0" text-anchor="middle" font-size="12" fill="#534AB7">routing_v2.yaml</text><rect x="440" y="200" width="200" height="146" rx="6" fill="none" stroke="#888780" stroke-width="0.75" stroke-dasharray="4 4"/><text x="452" y="218" font-size="12" fill="#5F5E5A">Measuring the judges</text><rect x="452" y="228" width="176" height="50" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="0.75"/><text x="540.0" y="249.0" text-anchor="middle" font-size="14" font-weight="600" fill="#712B13">L3 Blind labels</text><text x="540.0" y="267.0" text-anchor="middle" font-size="12" fill="#993C1D">Blind, kappa</text><rect x="452" y="286" width="176" height="50" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/><text x="540.0" y="307.0" text-anchor="middle" font-size="14" font-weight="600" fill="#3C3489">L5 Judge audit</text><text x="540.0" y="325.0" text-anchor="middle" font-size="12" fill="#534AB7">4 rewrites per answer</text><path d="M440 308 H412" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#a)"/><path d="M540 346 V388 H412" fill="none" stroke="#888780" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/><text x="548" y="372" text-anchor="start" font-size="12" fill="#5F5E5A">backtest</text><path d="M180 416 V432 H115 V446" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#a)"/><path d="M285 416 V446" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#a)"/><path d="M380 416 V432 H455 V446" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#a)"/><rect x="40" y="448" width="150" height="56" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.75"/><text x="115.0" y="472.0" text-anchor="middle" font-size="14" font-weight="600" fill="#2C2C2A">Auto-pass</text><text x="115.0" y="490.0" text-anchor="middle" font-size="12" fill="#5F5E5A">Both judges clean</text><rect x="210" y="448" width="150" height="56" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="0.75"/><text x="285.0" y="472.0" text-anchor="middle" font-size="14" font-weight="600" fill="#712B13">Human review</text><text x="285.0" y="490.0" text-anchor="middle" font-size="12" fill="#993C1D">Flagged + 10% audit</text><rect x="380" y="448" width="150" height="56" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.75"/><text x="455.0" y="472.0" text-anchor="middle" font-size="14" font-weight="600" fill="#2C2C2A">Auto-fail</text><text x="455.0" y="490.0" text-anchor="middle" font-size="12" fill="#5F5E5A">Not used yet</text><path d="M115 504 V526" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#a)"/><path d="M285 504 V526" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#a)"/><path d="M455 504 V526" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#a)"/><rect x="40" y="528" width="490" height="56" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/><text x="285.0" y="552.0" text-anchor="middle" font-size="14" font-weight="600" fill="#3C3489">L6 Scorecard, BigQuery + dbt</text><text x="285.0" y="570.0" text-anchor="middle" font-size="12" fill="#534AB7">Severe miss rate beside review load</text><path d="M285 584 V606" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#a)"/><polygon points="195,648 285,608 375,648 285,688" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.75"/><text x="285" y="652" text-anchor="middle" font-size="12" fill="#2C2C2A">Hard fail auto-passed?</text><path d="M375 648 H418" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#a)"/><text x="382" y="640" text-anchor="start" font-size="12" fill="#5F5E5A">yes</text><rect x="420" y="620" width="200" height="56" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="0.75"/><text x="520.0" y="644.0" text-anchor="middle" font-size="14" font-weight="600" fill="#712B13">dbt build fails</text><text x="520.0" y="662.0" text-anchor="middle" font-size="12" fill="#993C1D">Alert, nothing ships</text><path d="M285 688 V710" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#a)"/><text x="293" y="704" text-anchor="start" font-size="12" fill="#5F5E5A">no</text><rect x="135" y="712" width="300" height="56" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.75"/><text x="285.0" y="736.0" text-anchor="middle" font-size="14" font-weight="600" fill="#2C2C2A">Scorecard published</text><text x="285.0" y="754.0" text-anchor="middle" font-size="12" fill="#5F5E5A">Dagster runs the pipeline</text><rect x="40" y="790" width="14" height="14" rx="3" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/><text x="62" y="802" text-anchor="start" font-size="12" fill="#5F5E5A">Automated</text><rect x="160" y="790" width="14" height="14" rx="3" fill="#FAECE7" stroke="#993C1D" stroke-width="0.75"/><text x="182" y="802" text-anchor="start" font-size="12" fill="#5F5E5A">Human or alert</text><rect x="300" y="790" width="14" height="14" rx="3" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.75"/><text x="322" y="802" text-anchor="start" font-size="12" fill="#5F5E5A">Data or outcome</text></svg>
