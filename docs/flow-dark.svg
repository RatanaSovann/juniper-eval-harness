<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="t d">
<title id="t">How the harness checks an answer</title>
<desc id="d">Test cases go to the bot under test; answers pass rule checks and two AI judges; a versioned routing policy sends each answer to auto-pass, human review or auto-fail. Blind human labels measure judge agreement and backtest the router; a judge audit rewords answers to count verdict flips. Every step logs append-only files, which are loaded into BigQuery and built by dbt into a scorecard with alerts, orchestrated by Dagster.</desc>
<defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#6E7781"/></marker><marker id="headA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#4FB3A8"/></marker></defs>
<rect width="1000" height="560" fill="#0D1117"/>
<text x="32" y="42" font-family="-apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="17" font-weight="650" fill="#E6E3DE" text-anchor="start">Every answer is checked three ways; a versioned policy decides who reads it</text>
<text x="32" y="63" font-family="-apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#9EA7B0" text-anchor="start">Rules catch exact facts, two judges score the rest, and the judges themselves are measured against blind human labels.</text>
