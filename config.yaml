# Harness settings. Secrets never go here: the API key comes from the ANTHROPIC_API_KEY environment variable.

bot:
  provider: anthropic
  model: claude-haiku-4-5
  temperature: 0          # set to null for models that reject temperature (e.g. Sonnet 5.5, Opus 5.5)
  max_tokens: 1024
  price_usd_per_mtok:     # Anthropic list price, checked 25 Sep 2026
    input: 1.00
    output: 5.00

cost:
  max_aud_per_run: 5.00
  usd_to_aud: 1.60        # deliberately on the high side so the cap errs safe; update before paid runs

generate:
  scopes: [medical_support]   # coaching cases are skipped until a coaching prompt exists
  variants:
    v1_no_leaflets:
      prompt: prompts/grounded_v1.txt            # v1 instruction, no leaflets
    grounded:
      prompt: prompts/grounded_v2.txt
      leaflets: true

leaflets:
  - key: WEG_CMI
    path: data/leaflets/WEG_CMI.txt
    prepared: "2026-07"
  - key: MJ_CMI
    path: data/leaflets/MJ_CMI.txt
    prepared: "2026-09"

rule_checks:
  promptfoo_version: "0.124.0"            # pinned so results are repeatable
  promptfoo_config: promptfoo/promptfooconfig.yaml   # generated; do not edit by hand
  promptfoo_results: promptfoo/results.json
  hits: runs/rule_hits.csv                # append-only

labels:
  sheet: data/labels/label_sheet_v1_v2.csv      # your blind labels; never overwritten by the harness
  shuffle_seed: 20261008                  # fixed so the same run always gives the same row order
  rubric: rubric/rubric.md                # shown in the labelling app

judge:
  prompt: prompts/judge_v2.txt              # v1 kept for the record; v2 clarifies when to write MISSING
  answers_run: 20261008T141049Z-88741d    # v1 vs v2 run; the one your hand labels cover
  partition: dev                          # never tune judges on locked cases
  repeats: 2                              # each judge scores each answer twice, to measure consistency
  judges:                                 # fill in model and prices before a paid run; the judge refuses until you do
    - name: openai
      provider: openai                    # key from OPENAI_API_KEY
      model: gpt-6-luna                   # OpenAI's newest small tier
      temperature: null                   # provider default; reasoning models reject a set temperature
      max_tokens: 4000                    # reasoning models spend output tokens thinking, so leave headroom
      price_usd_per_mtok:                 # OpenAI list price, checked 9 Oct 2026
        input: 0.10
        output: 0.50
    - name: grok
      provider: xai                       # key from XAI_API_KEY; OpenAI-compatible API at api.x.ai
      model: grok-4.20-0309-reasoning     # dated snapshot, so it can't change underneath us. Replaced Gemini (9 Oct 2026):
                                          # flash-lite missed every hard fail; 3.8-flash hit free-tier quota and 503s
      temperature: null                   # reasoning model: provider default
      max_tokens: 8000                    # reasoning tokens count as output; headroom so JSON is never cut off
      price_usd_per_mtok:                 # xAI list price (prompts under 200k tokens), checked 9 Oct 2026
        input: 1.25
        output: 2.50

router:
  rules: rules/routing_v2.yaml           # your policy (v2 adopted 09 Oct 2026); reasoning in docs/routing_rules.md
  judge_runs:                             # whose verdicts the router reads; answers come from judge.answers_run
    openai: 20261009T001243Z-ff6b22       # gpt-6-luna, all 88 dev answers
    grok: 20261009T030812Z-16238e         # grok-4.20-0309-reasoning, all 88 dev answers (replaced flash-lite 9 Oct 2026;
                                          # backtest: same review load, 0 misses either way)

audit:                                    # Stage 6 judge audit (experiment E2): measurement only, never tuning
  partition: locked
  risk_levels: [critical]
  styles: [longer, shorter, politer, other_model]
  repeats: 2                              # repeats give the noise floor: how often a judge flips on identical text
  rewriter:
    provider: anthropic
    model: claude-sonnet-5-5              # not one of the judges; refusal fallback "default" is on
    temperature: null                     # Sonnet 5.5 rejects a custom temperature
    max_tokens: 8000
    price_usd_per_mtok:                   # Anthropic list price, checked 9 Oct 2026
      input: 2.00
      output: 10.00
  judges:                                 # the pair the router uses
    - name: openai
      provider: openai
      model: gpt-6-luna
      temperature: null
      max_tokens: 4000
      price_usd_per_mtok: {input: 0.10, output: 0.50}
    - name: grok
      provider: xai
      model: grok-4.20-0309-reasoning
      temperature: null
      max_tokens: 8000
      price_usd_per_mtok: {input: 1.25, output: 2.50}

warehouse:                                # Stage 7: BigQuery copy of the logs, rebuilt in full on every load
  project: juniper-eval-harness
  location: australia-southeast1          # Sydney; fixed once the datasets exist
  raw_dataset: juniper_eval_raw           # loaded by python -m harness.load
  dbt_dataset: juniper_eval               # built by dbt from the raw tables
  hand_labels: [data/labels/label_sheet.csv, data/labels/label_sheet_v1_v2.csv]
  ai_labels: [data/labels/claude_labels.csv, data/labels/claude_labels_locked.csv]

paths:
  cases: data/test_cases.csv
  sources: data/sources.md
  answers: runs/answers.jsonl
  judgements: runs/judgements.jsonl
  routes: runs/routes.jsonl
  rewrites: runs/rewrites.jsonl
